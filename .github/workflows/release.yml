name: Release

# Push a tag like v0.2.0 to build the Windows installer, sign the update and publish it.
# The app checks releases/latest/download/latest.json (tauri.conf.json, plugins.updater).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: INA ${{ github.ref_name }}
          releaseBody: |
            ## Como instalar
            1. Baixe o arquivo **-setup.exe** abaixo e instale.
            2. Se o Windows mostrar “O Windows protegeu o computador”: **Mais informações → Executar assim mesmo**.
            3. Precisa do Claude Code com login feito e do Git.

            Quem já tem o INA recebe esta versão pelo aviso **Atualizar e reiniciar**. Novidades em [CHANGELOG.md](https://github.com/ianeusantiago/Ina/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
