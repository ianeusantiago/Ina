<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa7ec"/>
      <stop offset="0.45" stop-color="#8fd6fb"/>
      <stop offset="0.75" stop-color="#d9f3ff"/>
      <stop offset="1" stop-color="#f2fbff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fffbe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#bff0ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#c8f7ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf0c8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cf0c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ec6a"/>
      <stop offset="1" stop-color="#4fb33a"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ff7a"/>
      <stop offset="0.35" stop-color="#6fd23c"/>
      <stop offset="1" stop-color="#2b8f22"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#bdefff" stop-opacity="0.12"/>
      <stop offset="0.95" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <symbol id="b" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="url(#bubble)"/>
      <circle cx="50" cy="50" r="47" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.6"/>
      <ellipse cx="34" cy="27" rx="13" ry="7" fill="#fff" opacity="0.9" transform="rotate(-30 34 27)"/>
      <circle cx="70" cy="74" r="4" fill="#fff" opacity="0.5"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 40 40">
      <path d="M20 0 23 17 40 20 23 23 20 40 17 23 0 20 17 17z" fill="#fff"/>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- sun and lens flare (top right) -->
  <circle cx="1540" cy="150" r="420" fill="url(#sun)"/>
  <g stroke="#fff" stroke-opacity="0.22" stroke-width="3">
    <line x1="1540" y1="150" x2="1100" y2="-80"/>
    <line x1="1540" y1="150" x2="1960" y2="520"/>
    <line x1="1540" y1="150" x2="1240" y2="600"/>
    <line x1="1540" y1="150" x2="1920" y2="-40"/>
  </g>
  <circle cx="1260" cy="390" r="70" fill="url(#flare)"/>
  <circle cx="1120" cy="520" r="34" fill="#fff" opacity="0.18"/>
  <circle cx="990" cy="640" r="110" fill="url(#flare)"/>

  <!-- soft clouds -->
  <g filter="url(#blur)" opacity="0.85">
    <ellipse cx="300" cy="230" rx="260" ry="70" fill="url(#cloud)"/>
    <ellipse cx="430" cy="200" rx="170" ry="60" fill="url(#cloud)"/>
    <ellipse cx="1050" cy="300" rx="220" ry="50" fill="url(#cloud)"/>
  </g>

  <!-- aurora / light ribbons -->
  <path d="M-100 620C300 430 620 700 980 560S1600 380 2020 470v70C1650 460 1320 600 980 650S320 520-100 720z" fill="url(#aurora)"/>
  <path d="M-100 700C380 560 700 780 1060 660S1640 520 2020 600v40C1660 580 1360 700 1060 730S380 640-100 760z" fill="url(#aurora2)"/>
  <path d="M-100 540C260 420 640 600 1000 500S1660 330 2020 400" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3"/>

  <!-- rolling glossy hills -->
  <path d="M-40 900C240 760 520 780 820 850S1400 800 1960 740V1120H-40z" fill="url(#hillBack)"/>
  <path d="M-40 990C300 860 640 900 980 960S1600 930 1960 860V1120H-40z" fill="url(#hillFront)"/>
  <path d="M-40 990C300 860 640 900 980 960S1600 930 1960 860" fill="none" stroke="#efffc8" stroke-width="6" opacity="0.8"/>
  <path d="M120 960C400 880 680 905 960 950" fill="none" stroke="url(#shine)" stroke-width="40" opacity="0.4" filter="url(#soft)"/>
  <!-- grass blades -->
  <g fill="#3fae2c" opacity="0.8">
    <path d="M200 1080c4-60 10-90 24-120-6 40-6 80-4 120z"/>
    <path d="M232 1080c-2-50 2-80 10-100 0 34 2 66 6 100z"/>
    <path d="M1700 1080c4-60 12-96 28-128-8 44-8 86-6 128z"/>
    <path d="M1740 1080c-2-44 2-70 12-92-2 30 0 60 4 92z"/>
  </g>

  <!-- glass bubbles -->
  <use href="#b" x="120" y="420" width="120" height="120"/>
  <use href="#b" x="260" y="610" width="56" height="56"/>
  <use href="#b" x="760" y="140" width="70" height="70" opacity="0.85"/>
  <use href="#b" x="1380" y="560" width="150" height="150"/>
  <use href="#b" x="1640" y="420" width="64" height="64"/>
  <use href="#b" x="1180" y="760" width="40" height="40"/>
  <use href="#b" x="560" y="520" width="34" height="34" opacity="0.8"/>
  <use href="#b" x="1820" y="760" width="90" height="90"/>

  <!-- sparkles -->
  <g opacity="0.9">
    <use href="#spark" x="1460" y="60" width="40" height="40"/>
    <use href="#spark" x="640" y="300" width="18" height="18"/>
    <use href="#spark" x="1010" y="180" width="22" height="22"/>
    <use href="#spark" x="330" y="760" width="16" height="16"/>
    <use href="#spark" x="1580" y="680" width="20" height="20"/>
  </g>
</svg>
