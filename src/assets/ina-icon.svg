<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Aqua glass tile: sky blue to deep sea, with a grassy green rim at the bottom -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="0.45" stop-color="#1fa8f0"/>
      <stop offset="0.78" stop-color="#0a6fc4"/>
      <stop offset="1" stop-color="#0b4f9a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6f25a"/>
      <stop offset="0.5" stop-color="#5cc931"/>
      <stop offset="1" stop-color="#2e8f1f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#e9fbff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- glass orb (agents) -->
    <radialGradient id="orb" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9f4ff"/>
      <stop offset="1" stop-color="#7cc8ee"/>
    </radialGradient>
    <!-- orchestrator core: glossy white pearl -->
    <radialGradient id="core" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#9fd6f2"/>
    </radialGradient>
    <radialGradient id="dotGreen" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d8ff9e"/><stop offset="1" stop-color="#2fae2a"/>
    </radialGradient>
    <radialGradient id="dotOrange" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe6a1"/><stop offset="1" stop-color="#f08a00"/>
    </radialGradient>
    <radialGradient id="dotViolet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0d4ff"/><stop offset="1" stop-color="#9a3fd6"/>
    </radialGradient>
    <radialGradient id="dotBlue" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#0a78d8"/>
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e2f6ff" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#04305e" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="clip">
      <path d="M512 64c264 0 360 0 408 48s48 144 48 400 0 352-48 400-144 48-408 48-360 0-408-48S56 768 56 512s0-352 48-400S248 64 512 64z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <!-- sun flare, top left -->
    <circle cx="250" cy="210" r="300" fill="url(#sun)"/>
    <!-- aurora swoosh -->
    <path d="M-40 520C200 380 420 610 640 470S980 360 1080 420v80C930 460 820 560 640 580S240 470-40 640z" fill="#fff" opacity="0.16"/>
    <!-- grassy hill -->
    <path d="M-20 880C180 790 360 820 520 850s340 20 524-60V1060H-20z" fill="url(#grass)"/>
    <path d="M-20 880C180 790 360 820 520 850s340 20 524-60" fill="none" stroke="#e8ffb8" stroke-width="10" opacity="0.7"/>
    <!-- bubbles -->
    <g fill="none" stroke="#fff">
      <circle cx="860" cy="250" r="44" stroke-width="5" opacity="0.6"/>
      <circle cx="160" cy="560" r="26" stroke-width="4" opacity="0.55"/>
      <circle cx="900" cy="560" r="18" stroke-width="3" opacity="0.5"/>
    </g>
    <circle cx="846" cy="234" r="12" fill="#fff" opacity="0.8"/>
    <circle cx="152" cy="551" r="7" fill="#fff" opacity="0.8"/>
  </g>

  <!-- orbit ring -->
  <circle cx="512" cy="520" r="292" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="10"/>
  <circle cx="512" cy="520" r="292" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="28" filter="url(#glow)"/>

  <!-- links: orchestrator to agents -->
  <g stroke="url(#link)" stroke-width="20" stroke-linecap="round" filter="url(#drop)">
    <line x1="512" y1="520" x2="512" y2="228"/>
    <line x1="512" y1="520" x2="258" y2="666"/>
    <line x1="512" y1="520" x2="766" y2="666"/>
  </g>

  <!-- agents: glass orbs -->
  <g filter="url(#drop)">
    <circle cx="512" cy="228" r="70" fill="url(#orb)"/>
    <circle cx="258" cy="666" r="70" fill="url(#orb)"/>
    <circle cx="766" cy="666" r="70" fill="url(#orb)"/>
    <!-- orchestrator: big pearl -->
    <circle cx="512" cy="520" r="128" fill="url(#core)"/>
  </g>
  <circle cx="512" cy="228" r="30" fill="url(#dotGreen)"/>
  <circle cx="258" cy="666" r="30" fill="url(#dotOrange)"/>
  <circle cx="766" cy="666" r="30" fill="url(#dotViolet)"/>
  <circle cx="512" cy="520" r="50" fill="url(#dotBlue)"/>
  <!-- specular highlights -->
  <g fill="#fff">
    <ellipse cx="490" cy="196" rx="30" ry="16" opacity="0.9"/>
    <ellipse cx="236" cy="634" rx="30" ry="16" opacity="0.9"/>
    <ellipse cx="744" cy="634" rx="30" ry="16" opacity="0.9"/>
    <ellipse cx="470" cy="452" rx="62" ry="30" opacity="0.85"/>
    <circle cx="500" cy="208" r="9" opacity="0.9"/>
    <circle cx="526" cy="505" r="11" opacity="0.7"/>
  </g>

  <!-- top gloss: the Aqua shine over the tile -->
  <path clip-path="url(#clip)" d="M56 112C56 80 80 64 120 64h784c40 0 64 16 64 48v236C800 300 640 286 512 286S224 300 56 348z" fill="url(#gloss)" opacity="0.55"/>
  <!-- glass rim -->
  <path d="M512 64c264 0 360 0 408 48s48 144 48 400 0 352-48 400-144 48-408 48-360 0-408-48S56 768 56 512s0-352 48-400S248 64 512 64z" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="8"/>
</svg>
