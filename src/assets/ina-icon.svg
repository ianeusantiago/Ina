<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="0.55" stop-color="#007aff"/>
      <stop offset="1" stop-color="#3634a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9ff"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS squircle -->
  <path fill="url(#bg)" d="M512 72c260 0 356 0 404 48s48 144 48 392-0 344-48 392-144 48-404 48-356 0-404-48S60 760 60 512s0-344 48-392S252 72 512 72z"/>
  <path fill="url(#glow)" d="M512 72c260 0 356 0 404 48s48 144 48 392-0 344-48 392-144 48-404 48-356 0-404-48S60 760 60 512s0-344 48-392S252 72 512 72z"/>
  <!-- orbit -->
  <ellipse cx="512" cy="532" rx="300" ry="300" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="10"/>
  <!-- links: orchestrator to agents -->
  <g stroke="#fff" stroke-opacity="0.75" stroke-width="16" stroke-linecap="round">
    <line x1="512" y1="532" x2="512" y2="232"/>
    <line x1="512" y1="532" x2="252" y2="682"/>
    <line x1="512" y1="532" x2="772" y2="682"/>
  </g>
  <!-- agents -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="232" r="62" fill="#fff"/>
    <circle cx="252" cy="682" r="62" fill="#fff"/>
    <circle cx="772" cy="682" r="62" fill="#fff"/>
    <!-- orchestrator -->
    <circle cx="512" cy="532" r="118" fill="url(#core)"/>
  </g>
  <circle cx="512" cy="232" r="26" fill="#34c759"/>
  <circle cx="252" cy="682" r="26" fill="#ff9f0a"/>
  <circle cx="772" cy="682" r="26" fill="#af52de"/>
  <circle cx="512" cy="532" r="44" fill="#007aff"/>
</svg>
